<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>AI Job Analyzer</title>
  <style>
    body { font-family: system-ui, sans-serif; width: 380px; padding: 12px; margin: 0; }
    h1 { font-size: 14px; margin: 0 0 8px; }
    .row { display: flex; gap: 8px; margin-bottom: 8px; }
    button { flex: 1; padding: 6px 10px; cursor: pointer; font-size: 12px; }
    #stop { background: #d9342b; color: #fff; border: none; border-radius: 4px; }
    #start { border-radius: 4px; }
    #status { font-size: 12px; font-weight: 600; margin-bottom: 2px; min-height: 16px; }
    #stats { font-size: 11px; color: #777; margin-bottom: 8px; min-height: 14px; }
    #error { font-size: 11px; color: #d9342b; margin-bottom: 8px; }
    table { width: 100%; border-collapse: collapse; font-size: 11px; margin-bottom: 8px; }
    th, td { text-align: left; padding: 3px 4px; border-bottom: 1px solid #eee; }
    tbody { display: block; max-height: 220px; overflow-y: auto; }
    thead, tbody tr { display: table; width: 100%; table-layout: fixed; }
    /* Each tbody row is its own independent "table" (the display:table hack
       above, needed to keep the header fixed while the body scrolls), so
       fixed layout can't infer column widths from the real header row —
       every row needs its own matching widths via nth-child. */
    th:nth-child(1), td:nth-child(1) { width: 15%; }
    th:nth-child(2), td:nth-child(2) { width: 55%; }
    th:nth-child(3), td:nth-child(3) { width: 30%; }
    tr.processing { background: #eee; font-style: italic; color: #555; }
    tr.duplicate { background: #f7f7f7; color: #999; }
    #disclaimer { font-size: 10px; color: #a00; line-height: 1.4; }
  </style>
</head>
<body>
  <h1>AI Job Analyzer</h1>
  <div id="status">Status: idle</div>
  <div id="stats"></div>
  <div id="error"></div>
  <div class="row">
    <button id="start">Start</button>
    <button id="stop">■ Stop</button>
  </div>
  <div class="row">
    <button id="exportCsv">Export CSV</button>
    <button id="exportJson">Export JSON</button>
  </div>
  <div class="row">
    <button id="clear">Clear results</button>
  </div>
  <table id="results">
    <thead><tr><th>Score</th><th>Title</th><th>Company</th></tr></thead>
    <tbody></tbody>
  </table>
  <div id="disclaimer">
    Never applies to any posting automatically — it only shows matches.
    Automating interactions on LinkedIn may violate its Terms of Service —
    use it at your own discretion and risk.
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
