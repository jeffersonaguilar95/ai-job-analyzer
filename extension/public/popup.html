<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>AI Job Analyzer</title>
  <style>
    body { font-family: system-ui, sans-serif; width: 380px; padding: 12px; margin: 0; }
    h1 { font-size: 14px; margin: 0 0 8px; }
    .row { display: flex; gap: 8px; margin-bottom: 8px; }
    button { flex: 1; padding: 6px 10px; cursor: pointer; font-size: 12px; }
    #stop { background: #d9342b; color: #fff; border: none; border-radius: 4px; }
    #start { border-radius: 4px; }
    #status { font-size: 12px; color: #555; margin-bottom: 8px; min-height: 16px; }
    #error { font-size: 11px; color: #d9342b; margin-bottom: 8px; }
    table { width: 100%; border-collapse: collapse; font-size: 11px; margin-bottom: 8px; }
    th, td { text-align: left; padding: 3px 4px; border-bottom: 1px solid #eee; }
    tbody { display: block; max-height: 220px; overflow-y: auto; }
    thead, tbody tr { display: table; width: 100%; table-layout: fixed; }
    #disclaimer { font-size: 10px; color: #a00; line-height: 1.4; }
  </style>
</head>
<body>
  <h1>AI Job Analyzer</h1>
  <div id="status">Estado: idle</div>
  <div id="error"></div>
  <div class="row">
    <button id="start">Start</button>
    <button id="stop">■ Detener</button>
  </div>
  <div class="row">
    <button id="exportCsv">Exportar CSV</button>
    <button id="exportJson">Exportar JSON</button>
  </div>
  <table id="results">
    <thead><tr><th style="width:15%">Score</th><th style="width:55%">Título</th><th style="width:30%">Empresa</th></tr></thead>
    <tbody></tbody>
  </table>
  <div id="disclaimer">
    No aplica automáticamente a ninguna oferta, solo muestra matches. Automatizar
    interacciones en LinkedIn puede violar sus Términos de Servicio — usalo bajo tu
    propio criterio y riesgo.
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
